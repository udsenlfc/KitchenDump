services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kitchendump
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: kitchendump
      DB_USER: admin
      DB_PASSWORD: password
    volumes:
      - .:/app

volumes:
  pgdata: